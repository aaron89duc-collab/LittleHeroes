<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1230" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little Heroes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Little Heroes: Royal City Brawl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap&subset=vietnamese" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overscroll-behavior: none; background: #060a1c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b1230; color: #fff; font: 600 20px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; flex-direction: column; gap: 16px; }
      #rotate .phone { width: 48px; height: 80px; border: 4px solid #ffd23f; border-radius: 10px; animation: rot 1.6s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #fs-gate { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(6,10,28,0.92); color: #fff; font: 600 18px "Baloo 2", system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; flex-direction: column; gap: 18px; padding: 24px; box-sizing: border-box; }
      #fs-gate.show { display: flex; }
      #fs-gate button { font: 800 24px "Baloo 2", system-ui, sans-serif; color: #0b1230; background: #ffd23f; border: 0; border-radius: 16px; padding: 16px 32px; box-shadow: 0 6px 0 #a87d00; }
      #fs-gate .sub { font-size: 15px; opacity: 0.85; max-width: 520px; }
      #fs-gate .ghost { background: transparent; color: #c9d6ff; box-shadow: none; font-size: 17px; text-decoration: underline; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fs-gate"><div id="fs-title">LITTLE HEROES</div><button id="fs-go">▶ CHƠI TOÀN MÀN HÌNH</button><div class="sub" id="fs-msg"></div><button class="ghost" id="fs-skip">Chơi không toàn màn hình</button></div>
    <div id="rotate"><div class="phone"></div><div>Hãy xoay ngang điện thoại để chơi</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
